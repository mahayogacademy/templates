kind = "web"
previewPath = "/"
title = "About the Academy"
version = "1.0.0"
id = "artifacts/about-academy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23254

[services.development]
run = "pnpm --filter @workspace/about-academy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/about-academy", "run", "build" ]
publicDir = "artifacts/about-academy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23254"
BASE_PATH = "/"
